<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srijeet’s Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6785;
    --line: #c9d1e3;
    --stitch: #e4572e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a2e;
      --surface: #16233d;
      --ink: #eef1f6;
      --muted: #93a0bd;
      --line: #2c3c5e;
      --stitch: #ff8a5c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
  }
  main {
    height: 100dvh;
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: clamp(14px, 3vh, 36px) clamp(16px, 3vw, 32px);
  }
  section { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  .date { color: var(--muted); margin: 0 0 6px; font-size: clamp(.85rem, 1.8vh, 1.05rem); }
  h1 {
    font-size: clamp(1.8rem, 7vh, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .stitch { border: 0; border-top: 3px dashed var(--stitch); margin: clamp(10px, 2.5vh, 24px) 0; flex: none; }

  /* groups fill the remaining height */
  #groups {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 2vw, 24px);
  }
  .group {
    display: grid;
    grid-template-rows: auto repeat(3, minmax(0, 1fr));
    min-height: 0;
    gap: 10px;
  }
  .group h2 { font-size: 1rem; margin: 0; font-weight: 600; color: var(--muted); }
  .tile {
    min-height: 0;
    text-align: left;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .tile:hover { border: 1.5px solid var(--stitch); transform: translateY(-2px); }
  .tile:focus-visible, .back:focus-visible { outline: 3px solid var(--stitch); outline-offset: 2px; }
  .tile b { display: block; font-size: clamp(1rem, 2.4vh, 1.2rem); margin-bottom: 4px; }
  .tile span { color: var(--muted); font-size: clamp(.8rem, 1.8vh, .95rem); line-height: 1.3; }

  .back {
    font: inherit; background: none; border: 0; color: var(--muted);
    cursor: pointer; padding: 0; margin-bottom: 12px; font-size: 1rem; align-self: flex-start;
  }
  .back:hover { color: var(--ink); }
  .view h1 { font-size: clamp(1.6rem, 5vh, 2.6rem); }
  .empty {
    flex: 1; min-height: 0; overflow: auto;
    border: 1.5px dashed var(--line); border-radius: 14px;
    padding: 24px; color: var(--muted);
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }

  /* narrow screens: tiles in 2 columns, no descriptions, still no scroll */
  @media (max-width: 720px) {
    #groups { grid-template-columns: 1fr; gap: 8px; }
    .group { display: flex; flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: 8px; }
    .group h2 { width: 100%; }
    .tile { flex: 1 1 calc(50% - 4px); padding: 8px 12px; }
    .tile span { display: none; }
  }
</style>
</head>
<body>
<main>

  <!-- HOME -->
  <section id="home">
    <p class="date" id="date"></p>
    <h1><span id="greet"></span> Srijeet</h1>
    <hr class="stitch">
    <div id="groups"></div>
  </section>

  <!-- TILE SCREEN -->
  <section id="view" class="view" hidden>
    <button class="back" id="back">&larr; Back</button>
    <h1 id="viewTitle"></h1>
    <hr class="stitch">
    <div class="empty" id="viewBody">Not connected yet.</div>
  </section>

</main>

<script>
  // ---- Greeting ----
  function updateGreeting() {
    const now = new Date();
    const h = now.getHours();
    let g = "Good night";
    if (h >= 5 && h < 12) g = "Good morning";
    else if (h >= 12 && h < 17) g = "Good afternoon";
    else if (h >= 17 && h < 21) g = "Good evening";
    document.getElementById("greet").textContent = g + ",";
    document.getElementById("date").textContent = now.toLocaleDateString("en-IN", {
      weekday: "long", day: "numeric", month: "long"
    });
  }
  updateGreeting();
  setInterval(updateGreeting, 60000);

  // ---- Tiles ----
  const groups = [
    { name: "Stock", tiles: [
      { id: "add-inventory", title: "Add inventory",  desc: "Log a new drop or restock" },
      { id: "record-sale",   title: "Record a sale",  desc: "Reduce stock when something sells" },
      { id: "check-stock",   title: "Check stock",    desc: "See what you have and what is low" }
    ]},
    { name: "Money", tiles: [
      { id: "log-expense",     title: "Log an expense",   desc: "Fabric, packaging, ads, shipping" },
      { id: "expenses-report", title: "Expenses report",  desc: "Where your money went" },
      { id: "sales-report",    title: "Sales report",     desc: "Revenue and profit by day or week" }
    ]},
    { name: "Tools", tiles: [
      { id: "price-calculator", title: "Price calculator", desc: "Find your selling price from cost and margin" },
      { id: "profit-summary",   title: "Profit summary",   desc: "Revenue minus costs and expenses" },
      { id: "returns",          title: "Returns",          desc: "Log returns and put items back in stock" }
    ]}
  ];

  const byId = {};
  const groupsEl = document.getElementById("groups");
  groups.forEach(g => {
    const wrap = document.createElement("div");
    wrap.className = "group";
    const h2 = document.createElement("h2");
    h2.textContent = g.name;
    wrap.appendChild(h2);
    g.tiles.forEach(t => {
      byId[t.id] = t;
      const b = document.createElement("button");
      b.className = "tile";
      b.innerHTML = "<b></b><span></span>";
      b.querySelector("b").textContent = t.title;
      b.querySelector("span").textContent = t.desc;
      b.onclick = () => { location.hash = t.id; };
      wrap.appendChild(b);
    });
    groupsEl.appendChild(wrap);
  });

  // ---- Navigation ----
  const home = document.getElementById("home");
  const view = document.getElementById("view");
  function route() {
    const t = byId[location.hash.slice(1)];
    home.hidden = !!t;
    view.hidden = !t;
    if (t) {
      document.getElementById("viewTitle").textContent = t.title;
      document.getElementById("viewBody").textContent = "This screen is not connected yet.";
    }
  }
  document.getElementById("back").onclick = () => { location.hash = ""; };
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
